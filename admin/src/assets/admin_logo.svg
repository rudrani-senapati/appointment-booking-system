  <text x="56" y="44" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="8.5" fill="#64748B" letter-spacing="1.8">HEALTHCARE COMMAND</text>
